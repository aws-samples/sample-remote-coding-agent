[pytest]
pythonpath = agent/src api/src mcp/src tests infra
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

# `--dist loadfile` is load-bearing, not a preference. Handler modules bind their
# table names at import time, so several test files `importlib.reload` them; the
# reload order is a within-file contract and only `loadfile` keeps a file's tests
# on one worker.
#
# `-n0` is the serial escape hatch: `python -m pytest -q -n0 tests/test_graph.py`.
# `-p no:xdist` is NOT -- it unregisters the plugin that owns `-n`/`--dist` while
# `addopts` still passes them, and the run aborts before collection.
addopts = -n auto --dist loadfile
