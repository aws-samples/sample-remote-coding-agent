# The in-container ADOT collector (CLAUDE.md invariant 32b): the Claude Code CLI exports
# OTLP metrics to the loopback, this signs them with the execution role's credentials and
# POSTs them to CloudWatch, which reads them back as Coding Agent Insights.
#
# This file is copied into the image unconditionally; the collector binary is not. It is
# about a kilobyte, and a configuration with no binary is inert -- so the image carries one
# fewer conditional and `telemetry.COLLECTOR_BINARY` stays the single thing that decides
# whether anything exports. `agent/Dockerfile`'s `ENABLE_OTEL_COLLECTOR` build argument is
# what installs the binary, and it defaults to off.
#
# THE COLLECTOR AUTHENTICATES WITH SIGV4 AND NEVER WITH A BEARER TOKEN. A CloudWatch bearer
# token is a long-term IAM-user credential, and this fleet's entire credential story is "one
# PAT, never in the environment". `sigv4auth` needs no credential written anywhere: the
# collector runs as the same user as the server process and inherits the container's
# execution-role credentials from the standard provider chain. If SigV4 ever stops working,
# the correct outcome is to drop Coding Agent Insights, not to adopt the token path.

extensions:
  # Service `monitoring` is CloudWatch's SigV4 service name, and the IAM action the signed
  # request authorises is `cloudwatch:PutMetricData` -- granted to the execution role by
  # `api/src/handlers/provisioner.py`'s `PublishAgentMetrics` statement, and only when the
  # same flag that installed this binary is on.
  sigv4auth:
    # `${env:AWS_REGION}` rather than a baked region, so one image runs in every region
    # AgentCore places it in. A hardcoded region here is a wrong-region signature, which
    # CloudWatch rejects rather than redirects.
    region: ${env:AWS_REGION}
    service: monitoring

receivers:
  otlp:
    protocols:
      http:
        # 127.0.0.1, NOT 0.0.0.0 (invariant 32b says the loopback). The OTLP receiver is
        # unauthenticated: bound to the wildcard it would be reachable on the container's
        # VPC interface, which is an open metrics ingest for anything in the subnet.
        # Port 4318 is the HTTP port, and the CLI is pointed at it with
        # `OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf` -- its own default is gRPC on 4317.
        endpoint: 127.0.0.1:4318

processors:
  batch:
    send_batch_size: 200
    timeout: 10s

exporters:
  otlphttp:
    # `metrics_endpoint`, NEVER `endpoint`. `endpoint` is a *base* to which this exporter
    # appends `/v1/metrics`, and the CloudWatch URL already ends in `/v1/metrics` -- so
    # `endpoint` POSTs to `/v1/metrics/v1/metrics` and every single export 404s, silently
    # as far as the task is concerned.
    metrics_endpoint: https://monitoring.${env:AWS_REGION}.amazonaws.com/v1/metrics
    compression: gzip
    auth:
      authenticator: sigv4auth

service:
  # Metrics only. There is no logs pipeline and no traces pipeline on purpose: the CLI's
  # OTel *log* stream carries session and optionally prompt content, and this fleet's
  # compliance claim is that a repository's source stays in the clone. The CLI side is
  # pinned off too, with `OTEL_LOGS_EXPORTER=none` in `provisioner._fleet_environment`.
  extensions: [sigv4auth]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
