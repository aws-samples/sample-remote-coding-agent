# The type checker's configuration, and the ONLY place its adoption baseline is recorded.
#
# ENFORCED: mypy is the LAST command of the `lint` recipe in `Makefile`, and the count is
# zero -- `Success: no issues found in 46 source files`. It was adopted the other way round
# on purpose: every finding was left unfixed at first, because the fix-versus-ignore
# decision has to be made against a number. The block below is that number, and the
# findings it counts have since been fixed across all four trees -- so it is a record of the
# adoption and not a description of the tree today. It stays because `CLAUDE.md`'s
# `## Layout` table points here for "the recorded baseline finding count" and this is the
# only place it exists.
#
# ---------------------------------------------------------------------------------------
# BASELINE AT ADOPTION -- mypy 1.20.2 (any 1.x inside `requirements-dev.txt`'s
# `mypy>=1.11,<2`), run from the repository root as
#
#   .venv/bin/python -m mypy --config-file mypy.ini agent/src api/src mcp/src infra
#
#   32 errors in 13 files (46 source files checked)
#
#     agent/src   17   graph.py 4, hooks.py 4, local_run.py 4, subagents.py 2,
#                      server.py 1, nodes/review.py 1, nodes/submit.py 1
#     api/src      3   _common.py 1, cards.py 1, github_probe.py 1
#     mcp/src      4   client.py 2, format.py 2
#     infra        8   stacks/api_stack.py 8
#
# Counts and never line numbers: a reformat of the tree moves every line and would rot a
# recorded position while leaving a recorded count correct. By error code: arg-type 14,
# typeddict-item 4, return-value 4, list-item 4, union-attr 3, dict-item 1, call-overload 1,
# attr-defined 1.
#
# Where they cluster, i.e. how the next change divides the fixes:
#   * `TaskState`, the `TypedDict` in `agent/src/coding_agent/state.py`, threaded through
#     `graph.py` -- 4 in `graph.py`, 4 in `local_run.py` (`**dict[str, Any]` expanded into a
#     TypedDict), 1 in `server.py`, 1 in `subagents.py`. This is invariant 13b showing up as
#     types: `PAYLOAD_TO_STATE` and `OPTIONAL_PAYLOAD_FIELDS` exist because some payload
#     fields are optional, and a `dict[str, Any]` built from a payload is not a `TaskState`
#     until something narrows it.
#   * The SDK boundaries: 4 in `hooks.py` (the `claude_agent_sdk` hook-input union vs the
#     `dict[str, Any]` the callbacks take) and all 8 in `infra/stacks/api_stack.py`, which
#     are one `**dict[str, object]` splat into `Stack.__init__` reported once per keyword.
#   * The boto3 boundary is SMALLER than it looks. Without the per-module sections below the
#     count is 54, and 22 of those are `import-untyped` at the boto3/botocore import lines --
#     `api/src` alone goes 3 -> 17. Silencing the missing stubs leaves 3 real findings in
#     `api/src`, one of them in `api/src/handlers/_common.py`, the only place a boto3 client
#     is built (see `CLAUDE.md`'s `## Layout` notes).
#
# `warn_unused_ignores` flagged NONE of the three existing suppressions -- the two in
# `agent/src/coding_agent/graph.py` (`typeddict-item`, `literal-required`) and the one in
# `agent/src/coding_agent/config.py` (`assignment`). All three are live, so none of them is
# a stale finding hiding behind a comment.
# ---------------------------------------------------------------------------------------

[mypy]
# Matches `ruff.toml`'s `target-version = "py311"`. The interpreter that runs mypy here is
# newer; this is the version the code is checked AGAINST, and the container's is 3.11.
python_version = 3.11

# The mypy equivalent of `pytest.ini`'s `pythonpath = agent/src api/src mcp/src tests infra`,
# minus `tests` (out of scope for now). Load-bearing, not tidiness: the four trees import
# each other's TOP-LEVEL names -- `from coding_agent import subagents`, `import app`,
# `from stacks import account_stack` -- and without these four entries `infra/app.py` and
# `infra/stacks/api_stack.py` alone raise 8 `import-not-found` errors for `stacks.*`.
# Relative paths, so mypy must be invoked from the repository root, which is where
# `--config-file mypy.ini` already puts you.
mypy_path = agent/src:api/src:mcp/src:infra

# `infra/stacks/__init__.py` and `mcp/__init__.py` are ABSENT ON PURPOSE -- a fact
# `tests/test_docs.py`'s `_ABSENT_ON_PURPOSE` asserts stays true -- so `infra/stacks/` is a
# namespace package and mypy cannot use an `__init__.py` to find the package root.
#
# `explicit_package_bases` is what fixes the duplicate-module failure, and it is a
# CONFIGURATION problem rather than a finding: with `mypy_path` set but this flag off, every
# file under `infra/stacks/` is reported as
#     error: Source file found twice under different module names:
#            "agent_stack" and "stacks.agent_stack"
# and mypy stops with "errors prevented further checking" after 23 errors -- because
# `infra/stacks` is reachable both as a base of its own (giving `agent_stack`) and under the
# `infra` base (giving `stacks.agent_stack`). With the flag on, module names are derived only
# from the declared bases above, `stacks.agent_stack` wins, and all 46 files get checked.
namespace_packages = True
explicit_package_bases = True

# `infra/cdk.out` is excluded, and this is a bug fix rather than tidiness: the CDK writes the
# synthesized cloud assembly there, an `ecr_assets.DockerImageAsset` copies the **whole agent
# source tree** into it as `asset.<hash>/src/coding_agent/`, and `infra` is one of the four
# bases above -- so mypy finds a second copy of every module in that package and stops with
#     error: Source file found twice under different module names
# having checked nothing at all ("errors prevented further checking").
#
# What makes it worth a line: `make deploy` synthesizes, `cdk.out/` is in `.gitignore`, and
# `make lint` is the very next thing anyone runs. So a clean tree passes, one deploy later the
# identical tree fails, `git status` shows nothing to explain it, and the message names an
# `__init__.py` in a directory the operator has never heard of. The `agent/` tree is checked
# through its own base either way, so nothing is skipped -- only the copy.
exclude = (?x)(^|/)cdk\.out/

# The three the repository starts strict about. Everything else stays at mypy's non-strict
# default: this is an adoption, not a conversion, and a wall of `no-untyped-def` would bury
# the 32 real findings above.
#
# `warn_unused_ignores` is the one with teeth today -- a `# type: ignore` that no longer
# suppresses anything is a finding, not a comment, and the three in the tree were checked
# against it (see the baseline block).
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

# SQLite metadata store OFF, explicitly. mypy 1.20 flipped `sqlite_cache` to default True,
# and on a checkout living on an NFS/overlay mount -- which is exactly where this repository
# sits inside the coding agent's container, under `/mnt` -- the store's first
# `PRAGMA synchronous=OFF` raises `sqlite3.OperationalError: database is locked` and mypy
# dies as an `INTERNAL ERROR` having checked nothing. From the outside that is
# indistinguishable from a broken config, which is the whole reason this line is here rather
# than left to a default. The plain directory-of-files cache has no lock to contend for.
# Cost is a slightly slower warm cache. Note the cache is ~155 MB either way, which is why
# `.gitignore` carries `.mypy_cache/`.
sqlite_cache = False

# ---------------------------------------------------------------------------------------
# Third-party packages with no type information, one section per distribution. Deliberately
# NOT a global `ignore_missing_imports = True`: that would also swallow a first-party import
# that stopped resolving, which is the failure this file is supposed to make loud.
#
# Only two sections, because only two are needed. Every other third-party import in the four
# trees ships a `py.typed` marker with the versions `make setup` installs -- measured, not
# assumed: `aws_cdk`, `constructs`, `langgraph`, `langchain_core`, `mcp`, `pydantic`,
# `claude_agent_sdk`, `bedrock_agentcore`, `httpx` and `moto` all carry one, and mypy reports
# no missing stubs for any of them. A section for a package that HAS types would be config
# that lies, and it would silence the real errors if that package's stubs ever regressed.
# ---------------------------------------------------------------------------------------

# `import boto3` and `from boto3.dynamodb.conditions import Key` in
# `api/src/handlers/*` (all of them go through `_common`), `agent/src/coding_agent/store.py`,
# `agent/src/coding_agent/agentcore_memory.py` and `mcp/src/rca_mcp/client.py`. boto3 ships
# no `py.typed`; a follow-up could add `boto3-stubs` and get real signatures at the one
# boundary that builds clients, but that is a sixth dependency and not this change.
[mypy-boto3.*]
ignore_missing_imports = True

# `botocore.exceptions.ClientError` (every handler's error path), plus
# `botocore.auth.SigV4Auth` and `botocore.awsrequest.AWSRequest` in
# `mcp/src/rca_mcp/client.py`. Same distribution family as boto3 and equally unmarked.
[mypy-botocore.*]
ignore_missing_imports = True
